name: CI

# next is the branch every change targets (ADR-011), so CI triggers on pull
# requests into it and pushes to it as well as main. A workflow that triggered on
# main alone would leave next ungated, and CI Complete, the one required status,
# would never appear on a pull request into it.
on:
  pull_request:
    branches:
      - main
      - next
  push:
    branches:
      - main
      - next
  # Runs CI on any branch by hand, to check a branch before its pull request
  # exists or to run it again without a new commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main is a release pointer, and every change integrates on next (ADR-011), so
  # this refuses every pull request into main. The condition is on the step, not
  # the job: a job skipped by its own `if` reports "skipped", and CI Complete
  # requires "success".
  release-flow:
    name: Release Flow
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a pull request into main
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            echo "::error::Pull requests target next, not main. main moves only when next is promoted onto it (ADR-011). Retarget this pull request to next."
            exit 1
          fi
          echo "This pull request targets $BASE_REF."

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the pinned tool versions
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Setup Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ env.GO_TASK_VERSION }}

      # setup-go's cache is keyed on go.sum, so it never stores a binary built
      # from source; this one does, keyed on what decides the build.
      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-go${{ steps.setup-go.outputs.go-version }}

      - name: Build the pinned linter if the cache did not have it
        run: task tools:golangci-lint

      # The gates `task quality:verify` runs before a push, one step each so a
      # failure names itself.
      - name: Verify formatting
        run: task quality:format:verify

      - name: Verify line endings
        run: task quality:line-endings:verify

      - name: Validate decision records
        run: task quality:decisions

      - name: Verify the decision record index is current
        run: task docs:adr-index:verify

      - name: Verify each vendored specification is its stack's release
        run: task openapi:verify

      - name: Lint
        run: task quality:lint

      # Here only, not in quality:verify: its answer comes from a database it
      # fetches, and moves without the change (ADR-014).
      - name: Check for known vulnerabilities
        run: task quality:vulncheck

      - name: Run the unit suite with coverage
        run: task test:unit:coverage

      - name: Run the unit suite under the race detector
        run: task test:unit:race

      - name: Verify the live suite compiles
        run: task test:live:compile

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: .tmp/coverage.unit.out
          retention-days: 14
          if-no-files-found: warn

  # The unit suite natively on the other systems mm-mcp ships for: paths, line
  # endings and file systems differ there, and a test confined to Linux never
  # sees it (ADR-009).
  unit-tests-other-os:
    name: Unit Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # bash on Windows too, where a step's default shell is PowerShell.
      - name: Resolve the pinned tool versions
        shell: bash
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Setup Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ env.GO_TASK_VERSION }}

      - name: Run the unit suite
        run: task test:unit

  # The browsers `mm-mcp login` drives, on every system it ships for (ADR-009):
  # each runner's Chrome, Edge and Firefox, and Playwright's Chromium, started,
  # navigated, scripted, their cookies read and closed. No Mattermost is
  # involved; the live suite logs in with the browser on its own runner.
  browser-tests:
    name: Browser Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # bash on Windows too, where a step's default shell is PowerShell.
      - name: Resolve the pinned tool versions
        shell: bash
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ env.GO_TASK_VERSION }}

      - name: Run the browser tests
        run: task test:browser

  # The live suite against both supported ends (ADR-025), through the tasks a
  # developer runs. Team Edition needs no licence and no secret, so this runs on
  # pull requests from forks too.
  live-tests:
    name: Live Tests (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack:
          - latest
          - esr
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the pinned tool versions
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Setup Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ env.GO_TASK_VERSION }}

      - name: Start Mattermost and bootstrap it
        run: task stack:up STACK=${{ matrix.stack }}

      - name: Run the live suite with coverage
        run: task test:live:coverage STACK=${{ matrix.stack }}

      - name: Upload live coverage
        if: always() && matrix.stack == 'latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-live
          path: .tmp/coverage.live.out
          retention-days: 14
          if-no-files-found: warn

      - name: Dump Mattermost's log on failure
        if: failure()
        run: task stack:logs STACK=${{ matrix.stack }}

  # Separate from the suites, because a coverage breach is not a failing test,
  # and reporting it as "Live Tests failed" sends the reader looking for one.
  coverage-gates:
    name: Coverage Gates
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - live-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The patch gate diffs against the base branch, so it needs history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the pinned tool versions
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Setup Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ env.GO_TASK_VERSION }}

      - name: Download unit coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-unit
          path: .tmp

      - name: Download live coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-live
          path: .tmp

      # The patch is measured against the branch a change targets (ADR-011): a
      # pull request's base, and next for a branch run by hand before its pull
      # request exists. On next and main themselves the patch is empty: each of
      # their commits was measured by the pull request that brought it to next,
      # and diffing a branch against itself would only appear to measure
      # something. Global coverage still applies there.
      - name: Fetch the base the patch gate diffs against
        env:
          PR_BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$PR_BASE" ]; then
            base="$PR_BASE"
          elif [ "$BRANCH" = "next" ] || [ "$BRANCH" = "main" ]; then
            echo "On $BRANCH the patch gate has nothing to measure; its commits were measured on their pull requests."
            echo "COVERAGE_BASE_REF=HEAD" >> "$GITHUB_ENV"
            exit 0
          else
            base="next"
          fi
          git fetch origin "$base"
          echo "COVERAGE_BASE_REF=origin/$base" >> "$GITHUB_ENV"

      # No default for a missing key: a threshold stated here as well would be a
      # second home for the policy, applying exactly when the two disagree.
      - name: Verify the thresholds file is complete
        run: |
          set -euo pipefail
          source .github/coverage-thresholds.env
          : "${CI_COVERAGE_MIN_GLOBAL:?not set in .github/coverage-thresholds.env}"
          : "${CI_COVERAGE_MIN_PATCH:?not set in .github/coverage-thresholds.env}"

      - name: Apply the coverage thresholds
        run: task quality:coverage:gates COVERAGE_BASE_REF="$COVERAGE_BASE_REF"

      - name: Upload the merged profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-merged
          path: .tmp/coverage.merged.out
          retention-days: 14
          if-no-files-found: warn

  # Coverage history and the README badge. It gates nothing; it runs whenever the
  # gates ran, pass or fail, because a red build's coverage is still the number.
  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    needs:
      - coverage-gates
    if: always() && needs.coverage-gates.result != 'skipped' && needs.coverage-gates.result != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the merged profile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-merged
          path: .tmp

      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: .tmp/coverage.merged.out
          fail_ci_if_error: true
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docs-site:
    name: Docs Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Resolve the pinned tool versions
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Setup Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ env.GO_TASK_VERSION }}

      - name: Build the docs site strictly
        run: task docs:validate

  # The build half of a release on every pull request: every platform's archive
  # and bundle, so a change that breaks packaging fails here rather than in the
  # release that runs once it reaches main.
  release-artifacts:
    name: Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the pinned tool versions
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ env.GO_TASK_VERSION }}

      # The SBOMs are built here as in a release; only the signing, which needs
      # the release workflow's identity, is left out.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Build every release artifact
        run: task release:snapshot SNAPSHOT_SKIP=sign

      - name: Hold every SBOM to the binary it describes
        run: task release:sbom:verify

      - name: Check a bundle with the official mcpb tool
        run: task release:bundles:verify

      - name: Run the built binary
        run: |
          reported="$(dist/mm-mcp_linux_amd64_v1/mm-mcp version)"
          [ "$reported" = "mm-mcp v0.0.0" ] || { echo "::error::the binary reports '$reported'"; exit 1; }

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - release-flow
      - unit-tests
      - unit-tests-other-os
      - browser-tests
      - live-tests
      - coverage-gates
      - codecov
      - docs-site
      - release-artifacts
    if: always()
    steps:
      - name: Verify every required job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | map(select(.value.result != "success")) | if length == 0 then true else (map("\(.key): \(.value.result)") | join(", ") | error) end'
