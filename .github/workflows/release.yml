name: Release

# A push to main releases when its commits call for one (ADR-013). main moves only
# when next is fast-forwarded onto it (ADR-011), so this runs once per promotion.
# A manual run repeats a release that failed partway: the tag the earlier run
# left on the commit names the version again (tools/release), and every step
# below can run again over what that run already published.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  determine-version:
    name: Determine release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      should_release: ${{ steps.compute.outputs.should_release }}
      version: ${{ steps.compute.outputs.version }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse a source other than main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases run from main only, so the signatures name one workflow on one branch."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The tags decide the version, and a checkout that started while another
      # release was running has a stale list.
      - name: Compute the version from Conventional Commits
        id: compute
        run: |
          git fetch --tags --force origin
          go run ./tools/release version

      # A promotion is an administrator's fast-forward push, which no pull
      # request gated. The commit must carry the CI Complete it earned as the tip
      # of next. Both answers exist before the push, so this reads a result and
      # never waits for one.
      - name: Refuse a commit CI has not passed
        if: steps.compute.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}"
          for attempt in 1 2 3; do
            ci=$(gh api -X GET "$commit/check-runs" -f check_name='CI Complete' --jq '[.check_runs[] | .conclusion // .status] | join(", ")')
            if [[ ", $ci, " == *", success, "* ]]; then
              echo "CI Complete succeeded on ${GITHUB_SHA}."
              exit 0
            fi
            if [[ "$attempt" != 3 ]]; then sleep 10; fi
          done
          echo "::error::CI Complete on ${GITHUB_SHA} is: ${ci:-not reported}. Nothing was released. Run this workflow again once it has succeeded."
          exit 1

  # GoReleaser builds, archives, packages, scans and signs, and creates the
  # GitHub release as a draft with the notes tools/release wrote. The steps
  # after it are this project's own: every SBOM is held to its binary, the .mcpb
  # bundles are made from GoReleaser's binaries, signed and uploaded, everything
  # gets its build provenance, and only then is the release made public. A
  # check that fails leaves a draft nobody can install.
  release:
    name: Publish release
    needs: determine-version
    if: needs.determine-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
      PREVIOUS_TAG: ${{ needs.determine-version.outputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the pinned tool versions
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      # syft reads the licences from the module cache the build used.
      - name: Name the module cache
        run: echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Write the release notes
        run: go run ./tools/release notes -version "$VERSION" -previous-tag "$PREVIOUS_TAG" -repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

      # A tag already on this commit is kept. One on another commit means another
      # run published this version first, and this one stops.
      - name: Tag the release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin
          if ! git rev-parse --verify --quiet "$VERSION" >/dev/null; then
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          elif [ "$(git rev-list -n 1 "$VERSION")" != "$GITHUB_SHA" ]; then
            echo "::error::$VERSION already tags another commit; this run is superseded."
            exit 1
          fi

      - name: Build, sign and draft the release with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --draft --release-notes RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Hold every SBOM to the binary it describes
        run: go run ./tools/sbom-check -artifacts dist/artifacts.json -version "$VERSION"

      - name: Make, sign and upload the .mcpb bundles
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          go run ./tools/mcpb bundle -version "$VERSION"
          for bundle in dist/*.mcpb; do
            cosign sign-blob --yes --new-bundle-format --bundle "${bundle}.sigstore.json" "$bundle" > /dev/null
          done
          gh release upload "$VERSION" dist/*.mcpb dist/*.mcpb.sigstore.json --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.mcpb

      # v0.1.0 went out with an empty body because GoReleaser skipped the notes
      # it was given; a draft without them stays a draft.
      - name: Check the draft carries its release notes
        run: |
          set -euo pipefail
          body=$(gh release view "$VERSION" --json body --jq .body)
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::The draft release $VERSION has no notes; RELEASE_NOTES.md did not reach it."
            exit 1
          fi

      - name: Make the release public
        run: gh release edit "$VERSION" --draft=false --latest

      - name: Keep the archives, packages and SBOMs for the SBOM attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.spdx.json
          if-no-files-found: error

      - name: Keep the bundles for the registry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles
          path: dist/*.mcpb
          if-no-files-found: error

  # An SBOM attestation binds each archive and package to the SBOM of the binary
  # it holds, so an organisation can verify what it installs rather than trust a
  # file beside it. A Linux package installs the binary its platform's archive
  # holds, and is attested with that SBOM.
  attest-sboms:
    name: Attest ${{ matrix.subject }}
    needs:
      - determine-version
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { subject: linux_amd64.tar.gz, platform: linux_amd64 }
          - { subject: linux_amd64.deb, platform: linux_amd64 }
          - { subject: linux_amd64.rpm, platform: linux_amd64 }
          - { subject: linux_arm64.tar.gz, platform: linux_arm64 }
          - { subject: linux_arm64.deb, platform: linux_arm64 }
          - { subject: linux_arm64.rpm, platform: linux_arm64 }
          - { subject: darwin_amd64.tar.gz, platform: darwin_amd64 }
          - { subject: darwin_arm64.tar.gz, platform: darwin_arm64 }
          - { subject: windows_amd64.zip, platform: windows_amd64 }
          - { subject: windows_arm64.zip, platform: windows_arm64 }
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Download the archives, packages and SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archives
          path: dist

      - name: Name the subject and its SBOM
        id: files
        env:
          SUBJECT: ${{ matrix.subject }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "subject=dist/mm-mcp_${VERSION#v}_${SUBJECT}" >> "$GITHUB_OUTPUT"
          echo "sbom=dist/mm-mcp_${VERSION#v}_${PLATFORM}.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Attest the subject with its SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.subject }}
          sbom-path: ${{ steps.files.outputs.sbom }}

  # The registry names each bundle by its download address and checksum, so this
  # follows the GitHub release that hosts them.
  mcp-registry:
    name: Publish to the MCP Registry
    needs:
      - determine-version
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pinned tool versions
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download the bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles
          path: dist

      - name: Write server.json for this release
        run: go run ./tools/mcpb server-json -version "$VERSION" -bundles dist -base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${VERSION}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install mcp-publisher, verified against its signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          gh release download "$MCP_PUBLISHER_VERSION" --repo modelcontextprotocol/registry \
            --pattern "$archive" --pattern "$archive.sigstore.json" --dir .tmp/publisher
          cosign verify-blob \
            --bundle ".tmp/publisher/$archive.sigstore.json" \
            --certificate-identity-regexp '^https://github.com/modelcontextprotocol/registry/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ".tmp/publisher/$archive"
          tar -xzf ".tmp/publisher/$archive" -C .tmp/publisher mcp-publisher

      - name: Publish server.json
        run: |
          .tmp/publisher/mcp-publisher login github-oidc
          .tmp/publisher/mcp-publisher publish

  # The tap and the bucket are written after the release is public, from its
  # checksum manifest, so they never name a draft nobody can download. Each
  # push uses a token that may write only to its own repository, given only to
  # the step that pushes. A repeated run writes the same file and commits
  # nothing.
  homebrew:
    name: Publish to the Homebrew tap
    needs:
      - determine-version
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download the checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern sha256sums.txt --dir .tmp/release

      - name: Write the formula and push it to the tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone https://github.com/vriesdemichael/homebrew-tap.git .tmp/tap
          go run ./tools/packages homebrew -version "$VERSION" -repository "$GITHUB_REPOSITORY" -sums .tmp/release/sha256sums.txt -out .tmp/tap/Formula/mm-mcp.rb
          cd .tmp/tap
          git config credential.helper '!f() { printf "username=x-access-token\npassword=%s\n" "${TAP_GITHUB_TOKEN}"; }; f'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mm-mcp.rb
          git diff --cached --quiet || git commit -m "mm-mcp ${VERSION#v}"
          git push

  scoop:
    name: Publish to the Scoop bucket
    needs:
      - determine-version
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download the checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern sha256sums.txt --dir .tmp/release

      - name: Write the manifest and push it to the bucket
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          git clone https://github.com/vriesdemichael/scoop.git .tmp/bucket
          go run ./tools/packages scoop -version "$VERSION" -repository "$GITHUB_REPOSITORY" -sums .tmp/release/sha256sums.txt -out .tmp/bucket/mm-mcp.json
          cd .tmp/bucket
          git config credential.helper '!f() { printf "username=x-access-token\npassword=%s\n" "${SCOOP_BUCKET_TOKEN}"; }; f'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mm-mcp.json
          git diff --cached --quiet || git commit -m "mm-mcp: Update to version ${VERSION#v}"
          git push

  # Komac opens the pull request to microsoft/winget-pkgs from the fork, which
  # must match upstream first. It updates a package WinGet already has: the
  # first version is submitted by hand, with komac or wingetcreate, and until
  # that is merged this job says so and publishes nothing. Komac is run as its
  # released binary rather than through winget-releaser, which installs it with
  # an action pinned to a branch, which this repository refuses.
  winget:
    name: Publish to WinGet
    needs:
      - determine-version
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Find the package in WinGet
        id: known
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api repos/microsoft/winget-pkgs/contents/manifests/v/vriesdemichael/mm-mcp --silent 2>/dev/null; then
            echo "known=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::WinGet has no vriesdemichael.mm-mcp yet. Submit $VERSION by hand once; later releases follow on their own."
            echo "known=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bring the fork up to date with upstream
        if: steps.known.outputs.known == 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST /repos/vriesdemichael/winget-pkgs/merge-upstream -f branch=master --silent
          upstream=$(gh api /repos/microsoft/winget-pkgs/branches/master --jq .commit.sha)
          fork=$(gh api /repos/vriesdemichael/winget-pkgs/branches/master --jq .commit.sha)
          if [[ "$fork" != "$upstream" ]]; then
            echo "::error::The fork's master is at $fork, upstream's at $upstream, after merge-upstream."
            exit 1
          fi

      - name: Checkout
        if: steps.known.outputs.known == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pinned tool versions
        if: steps.known.outputs.known == 'true'
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Install Komac, held to its release's checksums
        if: steps.known.outputs.known == 'true'
        run: |
          set -euo pipefail
          number="${KOMAC_VERSION#v}"
          archive="komac-${number}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p .tmp/komac
          cd .tmp/komac
          base="https://github.com/russellbanks/Komac/releases/download/${KOMAC_VERSION}"
          curl -fsSL --retry 3 -o "$archive" "$base/$archive"
          curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          grep -E " \*?${archive}\$" SHA256SUMS | sha256sum -c
          tar -xzf "$archive"
          echo "$PWD/$(dirname "$(find . -name komac -type f | head -1)")" >> "$GITHUB_PATH"

      - name: Open the WinGet pull request
        if: steps.known.outputs.known == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          number="${VERSION#v}"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          komac update vriesdemichael.mm-mcp --version "$number" \
            --urls "$base/mm-mcp_${number}_windows_amd64.zip" "$base/mm-mcp_${number}_windows_arm64.zip" \
            --submit

  docs:
    name: Publish docs
    needs:
      - determine-version
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Resolve the pinned tool versions
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Setup Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ env.GO_TASK_VERSION }}

      - name: Publish the versioned docs to GitHub Pages
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          task docs:deploy-version VERSION="$VERSION"
