# Blank issues stay enabled on purpose.
#
# Discussions are not enabled on this repository, so issues are the venue for
# feature proposals, questions and design debate. The bug form is an offer for the
# one kind of report that benefits from structure; everything else goes in a
# blank issue.
blank_issues_enabled: true

contact_links:
  - name: Report a security vulnerability
    url: https://github.com/vriesdemichael/mm-mcp/security/advisories/new
    about: Please do not open a public issue. This opens a private advisory instead.
  - name: Contributing guide
    url: https://github.com/vriesdemichael/mm-mcp/blob/main/CONTRIBUTING.md
    about: Setting up, running the suites, and what CI checks before you open a pull request.
