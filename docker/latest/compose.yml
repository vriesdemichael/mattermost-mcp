# The newest Mattermost release, on http://localhost:8065 (ADR-025).
#
#   task stack:up                 # this one
#   task stack:up STACK=esr       # the Extended Support Release, beside it on 8066
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    labels:
      # An image updater on the developer's machine must not move the test
      # instance to a release the suite was not run against.
      com.centurylinklabs.watchtower.enable: "false"
      # Which checkout started it, so another checkout's `task stack:up` can
      # prune it once it has stopped (ADR-007).
      dev.mm-mcp.worktree: "${MM_STACK_WORKTREE:-}"
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser-password
      POSTGRES_DB: mattermost
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 20

  mattermost:
    image: mattermost/mattermost-team-edition:11.11.1
    restart: unless-stopped
    labels:
      # An image updater on the developer's machine must not move the test
      # instance to a release the suite was not run against.
      com.centurylinklabs.watchtower.enable: "false"
      # Which checkout started it, so another checkout's `task stack:up` can
      # prune it once it has stopped (ADR-007).
      dev.mm-mcp.worktree: "${MM_STACK_WORKTREE:-}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../mattermost.env
    # The main checkout publishes 8065; a linked worktree or a release passes
    # MM_HOST_PORT=0 and Docker assigns a free port (ADR-007).
    ports:
      - "127.0.0.1:${MM_HOST_PORT:-8065}:8065"
    volumes:
      - data:/mattermost/data

# Labelled with their checkout like the containers, so a prune finds the data a
# deleted worktree left behind even once its containers are gone (ADR-007).
volumes:
  postgres:
    labels:
      dev.mm-mcp.worktree: "${MM_STACK_WORKTREE:-}"
  data:
    labels:
      dev.mm-mcp.worktree: "${MM_STACK_WORKTREE:-}"
