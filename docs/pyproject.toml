# The documentation site's tooling (ADR-016). Run through the docs tasks, which
# call uv with --frozen against docs/uv.lock.
[project]
name = "mattermost-mcp-docs"
version = "0.1.0"
description = "Docs tooling for mattermost-mcp"
requires-python = ">=3.12"
dependencies = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "mike==2.2.0",
]
